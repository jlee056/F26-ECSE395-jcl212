; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; jcl212 - each sketch in src/ has its own setup()/loop(), so each gets its own environment
[platformio]
default_envs = tt_motor

[env]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
lib_deps = madhephaestus/ESP32Servo@^3.1.3
monitor_speed = 115200

[env:tt_motor]
build_src_filter = -<*> +<TT Motor.cpp>

[env:tt_rotate]
build_src_filter = -<*> +<TT Motor Rotate.cpp>

[env:tt_ec]
build_src_filter = -<*> +<TT Motor EC.cpp>

[env:servo]
build_src_filter = -<*> +<Servo Motor.cpp>

[env:servo_random]
build_src_filter = -<*> +<Servo Motor Random.cpp>

[env:servo_ec]
build_src_filter = -<*> +<Servo Motor EC.cpp>
