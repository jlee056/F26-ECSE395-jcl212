; jcl212 - PlatformIO configuration for Lab 2
[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200  ; jcl212 - must match Serial.begin(BAUD_RATE) in main.cpp

; jcl212 - pin the port to the USB-serial adapter so PlatformIO never
; jcl212 - falls back to auto-detecting a Bluetooth port and flashing that by mistake
upload_port = /dev/cu.usbserial*
monitor_port = /dev/cu.usbserial*
